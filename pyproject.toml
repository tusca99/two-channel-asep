[project]
name = "two-channel-asep"
version = "0.1.0"
description = "Monte Carlo reproduction of Pronina & Kolomeisky 2007: two-channel ASEP with narrow entrances"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "numba>=0.60",
    "scipy>=1.14",
    "tqdm>=4.66",
    "numba-cuda[cu12]>=0.30.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asep"]

[dependency-groups]
dev = [
    "jupyter",
    "pytest",
]
